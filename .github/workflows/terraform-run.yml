# Reusable workflow: fmt -> init -> validate -> plan [-> approval -> apply]
name: terraform-run

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      plan_role_arn:
        type: string
        required: true
      apply:
        type: boolean
        default: false
    outputs:
      has_changes:
        value: ${{ jobs.plan.outputs.has_changes }}

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  WORKDIR: stacks/data-platform

jobs:
  plan:
    name: plan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.plan_role_arn }}
          aws-region: eu-west-1

      - name: Format check
        run: terraform fmt -check -recursive -diff

      - name: Init
        run: terraform init -backend-config=backends/${{ inputs.environment }}.hcl

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -lock-timeout=5m -detailed-exitcode \
            -var-file=envs/${{ inputs.environment }}.tfvars -out=tfplan
          code=$?
          set -e
          # 0 = no changes, 1 = error, 2 = changes
          if [ "$code" -eq 1 ]; then exit 1; fi
          if [ "$code" -eq 2 ]; then echo "has_changes=true" >> "$GITHUB_OUTPUT"; else echo "has_changes=false" >> "$GITHUB_OUTPUT"; fi
          terraform show -no-color tfplan > plan.txt

      - name: Job summary
        run: |
          {
            echo "### Terraform plan: ${{ inputs.environment }}"
            if [ "${{ steps.plan.outputs.has_changes }}" = "false" ]; then
              echo "No changes. Infrastructure matches the configuration."
            else
              echo '```'; head -c 60000 plan.txt; echo; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const env = '${{ inputs.environment }}';
            const changes = '${{ steps.plan.outputs.has_changes }}' === 'true';
            let body = `### Terraform plan: \`${env}\`\n`;
            if (!changes) {
              body += 'No changes. Infrastructure matches the configuration.';
            } else {
              let plan = fs.readFileSync('${{ env.WORKDIR }}/plan.txt', 'utf8');
              if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... truncated, see job summary';
              body += '<details><summary>Show plan</summary>\n\n```\n' + plan + '\n```\n</details>';
            }
            const marker = `<!-- tf-plan-${env} -->`;
            body = marker + '\n' + body;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number });
            const old = comments.find(c => c.body.startsWith(marker));
            if (old) await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

      - name: Upload plan
        if: inputs.apply && steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ env.WORKDIR }}/tfplan
          retention-days: 1

  apply:
    name: apply (${{ inputs.environment }})
    needs: plan
    if: inputs.apply && needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    # Approval gate lives here: GitHub pauses until required reviewers approve.
    environment: ${{ inputs.environment }}
    # One apply at a time per environment, never cancelled midway.
    concurrency:
      group: tf-apply-${{ inputs.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.APPLY_ROLE_ARN }}
          aws-region: eu-west-1

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ env.WORKDIR }}

      - name: Init
        run: terraform init -backend-config=backends/${{ inputs.environment }}.hcl

      - name: Apply the reviewed plan
        run: terraform apply -no-color -lock-timeout=5m tfplan

      - name: Report
        if: always()
        run: echo "Apply to ${{ inputs.environment }} finished with status ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
